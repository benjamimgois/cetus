<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
  <!-- Notebook body -->
  <rect x="4" y="2" width="14" height="20" rx="1.5" ry="1.5" fill="#e0e0e0" stroke="#bdbdbd" stroke-width="0.5"/>
  <!-- Spine / left binding -->
  <rect x="4" y="2" width="3" height="20" rx="1" ry="1" fill="#9e9e9e"/>
  <!-- Spiral rings -->
  <circle cx="5.5" cy="6"  r="1.1" fill="none" stroke="#616161" stroke-width="1"/>
  <circle cx="5.5" cy="10" r="1.1" fill="none" stroke="#616161" stroke-width="1"/>
  <circle cx="5.5" cy="14" r="1.1" fill="none" stroke="#616161" stroke-width="1"/>
  <circle cx="5.5" cy="18" r="1.1" fill="none" stroke="#616161" stroke-width="1"/>
  <!-- Text lines on the page -->
  <line x1="9" y1="8"  x2="16" y2="8"  stroke="#9e9e9e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="11" x2="16" y2="11" stroke="#9e9e9e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="14" x2="16" y2="14" stroke="#9e9e9e" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="9" y1="17" x2="13" y2="17" stroke="#9e9e9e" stroke-width="1.2" stroke-linecap="round"/>
</svg>
