<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- Heatmap grid: 4x3 cells with varying fill to suggest intensity -->
  <!-- Row 1 (top) - low intensity -->
  <rect x="2"  y="2"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.3"/>
  <rect x="7"  y="2"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.5"/>
  <rect x="12" y="2"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.7"/>
  <rect x="17" y="2"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.4"/>
  <!-- Row 2 (middle) - medium/high intensity -->
  <rect x="2"  y="8"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.5"/>
  <rect x="7"  y="8"  width="4" height="4" rx="0.5" fill="#555555" opacity="1.0"/>
  <rect x="12" y="8"  width="4" height="4" rx="0.5" fill="#555555" opacity="1.0"/>
  <rect x="17" y="8"  width="4" height="4" rx="0.5" fill="#555555" opacity="0.6"/>
  <!-- Row 3 (bottom) - fading -->
  <rect x="2"  y="14" width="4" height="4" rx="0.5" fill="#555555" opacity="0.3"/>
  <rect x="7"  y="14" width="4" height="4" rx="0.5" fill="#555555" opacity="0.7"/>
  <rect x="12" y="14" width="4" height="4" rx="0.5" fill="#555555" opacity="0.8"/>
  <rect x="17" y="14" width="4" height="4" rx="0.5" fill="#555555" opacity="0.4"/>
  <!-- Bottom axis ticks -->
  <line x1="2" y1="20" x2="21" y2="20" stroke="#555555" stroke-width="1" stroke-linecap="round"/>
</svg>
