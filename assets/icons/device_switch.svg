<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- body (1U rack unit) -->
  <rect x="1" y="8" width="22" height="8" rx="1.5" fill="#00897B"/>
  <!-- port row -->
  <rect x="2.5" y="10.5" width="2" height="3" rx="0.4" fill="#004D40" opacity="0.7"/>
  <rect x="5.5" y="10.5" width="2" height="3" rx="0.4" fill="#004D40" opacity="0.7"/>
  <rect x="8.5" y="10.5" width="2" height="3" rx="0.4" fill="#004D40" opacity="0.7"/>
  <rect x="11.5" y="10.5" width="2" height="3" rx="0.4" fill="#004D40" opacity="0.7"/>
  <rect x="14.5" y="10.5" width="2" height="3" rx="0.4" fill="#004D40" opacity="0.7"/>
  <!-- status LEDs -->
  <circle cx="19.5" cy="11.5" r="1" fill="#A5D6A7"/>
  <circle cx="19.5" cy="14.5" r="1" fill="#FFCC02"/>
  <!-- uplink arrows -->
  <polyline points="3.5,7 3.5,5 5.5,5" fill="none" stroke="#80CBC4" stroke-width="1.2" stroke-linecap="round"/>
  <polyline points="20.5,7 20.5,5 18.5,5" fill="none" stroke="#80CBC4" stroke-width="1.2" stroke-linecap="round"/>
</svg>
