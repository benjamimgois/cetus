<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- RJ45 plug body -->
  <rect x="4" y="5" width="16" height="12" rx="1.5" fill="none" stroke="#212121" stroke-width="1.5"/>
  <!-- 8 contact pins (vertical bars at the top of the body) -->
  <rect x="5.2"  y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="7.1"  y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="9.0"  y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="10.9" y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="12.8" y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="14.7" y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <rect x="16.6" y="5"   width="1.2" height="4" rx="0.3" fill="#212121"/>
  <!-- Latch / retention clip -->
  <path d="M4 14.5 L2 14.5 L2 17.5 L4 17.5" stroke="#212121" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Cable end -->
  <path d="M7 17 L7 20 M12 17 L12 20 M17 17 L17 20" stroke="#212121" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  <path d="M6 20 L18 20" stroke="#212121" stroke-width="1.4" stroke-linecap="round" fill="none"/>
</svg>
