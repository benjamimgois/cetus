<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#083F9C"/>
      <stop offset="100%" stop-color="#08A7A2"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="50" fill="url(#bg)"/>

  <!-- ── Whale body ── -->
  <g fill="none" stroke="white" stroke-linecap="round" stroke-linejoin="round">

    <!-- Body outline — top edge: n1→n2→n3→n5→n6 -->
    <polyline stroke-width="1.8"
      points="15,50 29,39 45,40 64.5,45 74.7,45.7"/>

    <!-- Body outline — bottom edge: n1→n7→n8→n6 -->
    <polyline stroke-width="1.8"
      points="15,50 38,59.5 48.8,64.5 74.7,45.7"/>

    <!-- Interior network connections -->
    <line stroke-width="1.6" x1="29"   y1="39"   x2="50"   y2="48"/>   <!-- n2→n4 -->
    <line stroke-width="1.6" x1="29"   y1="39"   x2="38"   y2="59.5"/> <!-- n2→n7 -->
    <line stroke-width="1.6" x1="45"   y1="40"   x2="50"   y2="48"/>   <!-- n3→n4 -->
    <line stroke-width="1.6" x1="50"   y1="48"   x2="64.5" y2="45"/>   <!-- n4→n5 -->
    <line stroke-width="1.6" x1="50"   y1="48"   x2="38"   y2="59.5"/> <!-- n4→n7 -->
    <line stroke-width="1.6" x1="50"   y1="48"   x2="48.8" y2="64.5"/> <!-- n4→n8 -->
    <line stroke-width="1.6" x1="64.5" y1="45"   x2="48.8" y2="64.5"/> <!-- n5→n8 -->

    <!-- ── Tail ── -->
    <!-- Stalk top: n6 → tail fork -->
    <path stroke-width="1.8"
      d="M74.7,45.7 C77,43 79.5,39 80.5,35"/>

    <!-- Upper fluke: outline path (stalk top → tip → back to notch) -->
    <path stroke-width="1.8"
      d="M80.5,35 C82,31 86,26.5 91,25
         C90,27.5 87,30 84.5,32
         C83.5,32.8 83,33 83,33"/>

    <!-- Notch bridge (tiny gap between flukes) -->
    <path stroke-width="1.8"
      d="M83,33 C83.5,34 84,35 84.5,35.5"/>

    <!-- Lower fluke: outline path (notch → tip → back to stalk bottom) -->
    <path stroke-width="1.8"
      d="M84.5,35.5 C86,35.5 89,36.5 91.5,39
         C89.5,39.5 87,39 85.5,40
         C84,41 82,42.5 80.5,44"/>

    <!-- Stalk bottom: back to n6 -->
    <path stroke-width="1.8"
      d="M80.5,44 C78.5,45 76.5,45.7 74.7,45.7"/>

  </g>

  <!-- ── Network nodes (white dots) ── -->
  <g fill="white">
    <circle cx="15"   cy="50"   r="2.2"/> <!-- n1 head    -->
    <circle cx="29"   cy="39"   r="2.2"/> <!-- n2         -->
    <circle cx="45"   cy="40"   r="2.2"/> <!-- n3         -->
    <circle cx="50"   cy="48"   r="2.2"/> <!-- n4 center  -->
    <circle cx="64.5" cy="45"   r="2.2"/> <!-- n5         -->
    <circle cx="74.7" cy="45.7" r="2.2"/> <!-- n6 tail    -->
    <circle cx="38"   cy="59.5" r="2.2"/> <!-- n7         -->
    <circle cx="48.8" cy="64.5" r="2.2"/> <!-- n8 bottom  -->
  </g>
</svg>
