<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- paper out (top) -->
  <rect x="7" y="2" width="10" height="5" rx="0.5" fill="#BCAAA4"/>
  <!-- printer body -->
  <rect x="2" y="7" width="20" height="10" rx="2" fill="#5D4037"/>
  <!-- paper slot -->
  <rect x="5" y="10" width="14" height="4" rx="0.5" fill="#4E342E"/>
  <!-- paper coming out (bottom) -->
  <rect x="7" y="13" width="10" height="6" rx="0.5" fill="#EFEBE9"/>
  <!-- lines on paper -->
  <rect x="9" y="15" width="6" height="0.8" rx="0.3" fill="#BCAAA4"/>
  <rect x="9" y="16.8" width="4" height="0.8" rx="0.3" fill="#BCAAA4"/>
  <!-- status LED -->
  <circle cx="18" cy="11" r="1.2" fill="#A5D6A7"/>
</svg>
