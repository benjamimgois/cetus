<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- FreeBSD devil mascot (Beastie) - stylised red devil head -->
  <!-- Body/head base -->
  <ellipse cx="12" cy="14" rx="7" ry="7.5" fill="#AB0000"/>
  <!-- Left horn -->
  <path d="M7 8 Q4 2 6 1 Q8 4 8.5 8Z" fill="#AB0000"/>
  <!-- Right horn -->
  <path d="M17 8 Q20 2 18 1 Q16 4 15.5 8Z" fill="#AB0000"/>
  <!-- Face highlight -->
  <ellipse cx="12" cy="14.5" rx="5" ry="5.5" fill="#CC1111"/>
  <!-- Eyes -->
  <circle cx="9.5" cy="12.5" r="1.3" fill="#fff"/>
  <circle cx="14.5" cy="12.5" r="1.3" fill="#fff"/>
  <circle cx="9.8" cy="12.5" r="0.7" fill="#200"/>
  <circle cx="14.8" cy="12.5" r="0.7" fill="#200"/>
  <!-- Nose -->
  <ellipse cx="12" cy="15.5" rx="1.2" ry="0.8" fill="#900000"/>
  <!-- Smile -->
  <path d="M9.5 17.5 Q12 19.5 14.5 17.5" stroke="#fff" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <!-- Tail -->
  <path d="M19 15 Q24 10 22 6 Q20 8 21 11 Q19 12 18.5 15Z" fill="#AB0000"/>
</svg>
