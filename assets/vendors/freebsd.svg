<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#ffffff">
  <!-- FreeBSD devil (Beastie) - simplified monochrome -->
  <!-- Head -->
  <ellipse cx="12" cy="14.5" rx="6.5" ry="7" fill="#ffffff"/>
  <!-- Left horn -->
  <path d="M7.5 9 Q5 2.5 7 1.5 Q9 5 9 9Z" fill="#ffffff"/>
  <!-- Right horn -->
  <path d="M16.5 9 Q19 2.5 17 1.5 Q15 5 15 9Z" fill="#ffffff"/>
  <!-- Cut-out eyes (dark holes) -->
  <circle cx="9.5" cy="12.5" r="1.3" fill="none" stroke="#ffffff" stroke-width="0"/>
  <circle cx="9.5" cy="12.5" r="1.3" fill="#000000" opacity="0.6"/>
  <circle cx="14.5" cy="12.5" r="1.3" fill="#000000" opacity="0.6"/>
  <!-- Nose -->
  <ellipse cx="12" cy="15.5" rx="1" ry="0.7" fill="#000000" opacity="0.4"/>
  <!-- Mouth smile -->
  <path d="M9.5 17.5 Q12 19.5 14.5 17.5" stroke="#000000" stroke-width="0.6" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Tail -->
  <path d="M18.5 15.5 Q23 10 21.5 6 Q19.5 9 20.5 12 Q19 13 18 15.5Z" fill="#ffffff"/>
</svg>
