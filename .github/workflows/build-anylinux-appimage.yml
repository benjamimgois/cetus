name: Build Anylinux AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged   # needed for FUSE / namespaces during uruntime

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build AppImage
        run: bash scripts/make-anylinux-appimage.sh

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Omnicom-AppImage
          path: Omnicom-*.AppImage
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Omnicom-*.AppImage
          generate_release_notes: true
